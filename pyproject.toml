[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithmic-hysteresis-llm-evaluation"
version = "0.1.0"
description = "Rigorous evaluation of LLM macroeconomic nowcasting under temporal and information constraints"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1.3",
    "numpy>=1.26.2",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
]
